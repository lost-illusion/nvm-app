name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: NVM_APP_VERSION="${GITHUB_REF_NAME#v}" sh Tools/make-dmg.sh
      - name: Attach DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/nvm-app-*.dmg
